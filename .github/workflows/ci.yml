name: CI

on:
  push:
    branches: [main, master, 'release/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run typecheck:tests
      - run: npm test
      - run: npm run check:boundaries
      - run: node scripts/gen-differences.mjs --check
      - run: npm run docs:api
      - run: npm run check:license
      - run: npm run audit
      # Development tools are audited and reported, not gated: fixing the current findings needs
      # major upgrades (Vitest 2 -> 5, TypeDoc), recorded in docs/threat-model.md.
      - name: npm audit (development tools, report only)
        run: npm audit
        continue-on-error: true

  bench:
    name: Benchmarks (ubuntu)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run bench

  browser:
    name: Browser tests (ubuntu, Chromium)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npx playwright test -c apps/ghostline/test/e2e
      - run: npx playwright test -c apps/fieldnote/test/e2e
      - run: npm run demo:ghostline
      - run: npm run demo:fieldnote

  reproducible-build:
    name: Reproducible build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/repro-build.mjs
