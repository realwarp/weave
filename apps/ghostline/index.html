<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GHOSTLINE</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color-scheme: light dark;
      }
      body {
        margin: 0 auto;
        max-width: 980px;
        padding: 1rem;
      }
      header {
        display: flex;
        gap: 1rem;
        align-items: center;
        flex-wrap: wrap;
      }
      h1 {
        margin: 0;
        letter-spacing: 0.1em;
      }
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
      }
      @media (max-width: 760px) {
        main {
          grid-template-columns: 1fr;
        }
      }
      section {
        border: 1px solid #8884;
        border-radius: 8px;
        padding: 0.75rem;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        border-top: 1px solid #8883;
        padding: 0.5rem 0;
      }
      form {
        display: grid;
        gap: 0.4rem;
      }
      .meta {
        opacity: 0.7;
        font-size: 0.85em;
      }
      .tag {
        display: inline-block;
        border: 1px solid #8886;
        border-radius: 999px;
        padding: 0 0.5em;
        margin-right: 0.25em;
        font-size: 0.8em;
      }
      .notice.open {
        font-weight: 600;
      }
      button {
        cursor: pointer;
      }
      #status {
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>GHOSTLINE</h1>
      <span>device: <strong id="device"></strong></span>
      <button id="sync" type="button">Sync</button>
      <span id="status" role="status"></span>
    </header>
    <main>
      <section aria-labelledby="ann-h">
        <h2 id="ann-h">Announcements</h2>
        <form id="ann-form">
          <input name="title" placeholder="Title" required />
          <textarea name="body" placeholder="Message"></textarea>
          <button type="submit">Save draft</button>
        </form>
        <ul id="announcements"></ul>
      </section>
      <section aria-labelledby="req-h">
        <h2 id="req-h">Requests</h2>
        <form id="req-form">
          <input name="title" placeholder="What is needed?" required />
          <input name="details" placeholder="Details" />
          <input name="tags" placeholder="Tags, comma separated" />
          <button type="submit">Ask for help</button>
        </form>
        <ul id="requests"></ul>
      </section>
      <section aria-labelledby="notices-h" style="grid-column: 1 / -1">
        <h2 id="notices-h">Notices</h2>
        <ul id="notices"></ul>
      </section>
    </main>
    <script type="module" src="./src/app.ts"></script>
  </body>
</html>
